name: redirect-targets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  redirect-targets:
    name: redirect-targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check w3id.org redirect targets
        run: python3 .github/scripts/check_redirect_targets.py
