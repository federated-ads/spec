name: docs-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-checks:
    name: docs-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Editorial checks (docs/STYLE.md)
        run: python3 scripts/check_docs.py
