name: docs-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-checks:
    name: docs-checks
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA (actions/checkout v4.4.0).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Editorial checks (docs/STYLE.md)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # On pull requests, run the checker from the base branch so a pull
          # request cannot weaken the checks in the same change. If the base
          # does not have the checker yet, use the pull request's copy.
          if [ -n "$BASE_REF" ] && git show "origin/$BASE_REF:scripts/check_docs.py" > /tmp/check_docs.py 2>/dev/null; then
            python3 -I /tmp/check_docs.py
          else
            python3 -I scripts/check_docs.py
          fi
