title: Federated Ads Protocol
description: An open, federated, owner-controlled protocol for advertising on the open web. Discussion draft.
markdown: kramdown
kramdown:
  input: GFM
exclude:
  - outreach
  - brainstorms
# Used by the theme's SEO tags (jekyll-seo-tag): site logo and default link-preview image.
logo: /brand/logo/png/federated-ads-symbol-colour-512.png
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /brand/social/og-image.png
        width: 1200
        height: 630
        alt: "The Federated Ads Protocol: an open, federated, owner-controlled protocol for advertising on the open web"
